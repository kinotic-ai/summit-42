name: GHCR Cleanup

# Every push to develop or main, and every pull request into them, stages summit-42 on ghcr.io under
# sha-<commit> (see build.yml), and nothing outside that workflow ever reads those tags; what ships is
# promoted to Docker Hub. So a staged image is dead weight as soon as no one is going to re-run the
# jobs of the run that produced it, and without this job they accumulate forever.
#
# Deliberately not done inline at the end of a build: re-running a failed job pulls the staged image
# again, so deleting it the moment the run finishes would break the retry. Sweeping on a delay also
# collects the images left behind by runs that never reached the results job: the ones
# cancel-in-progress superseded, and those that failed before promotion.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be deleted without deleting anything
        type: boolean
        default: false

jobs:
  cleanup:
    name: Prune Staged Images
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      # A run stages sha-<commit> in server_image and pulls it back in the jobs that follow, so any
      # commit whose run has not finished is still live no matter how old the image is. Both branch
      # tips are protected too: they are what the next scheduled run, or a re-run of the last one,
      # will pull, and a rebuild of an unchanged tip need not advance the package's updated_at.
      - name: Collect the tags a pipeline could still pull
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/${GITHUB_REPOSITORY}/actions/runs"
          # Each capture is its own assignment so that -e aborts the step on a failed call. Piping
          # the four together instead would swallow the failure and quietly protect fewer tags.
          in_progress=$(gh api "${runs}?status=in_progress&per_page=100" --jq '.workflow_runs[].head_sha')
          queued=$(gh api "${runs}?status=queued&per_page=100" --jq '.workflow_runs[].head_sha')
          develop=$(gh api "repos/${GITHUB_REPOSITORY}/branches/develop" --jq '.commit.sha')
          main=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          tags=$(printf '%s\n' $in_progress $queued $develop $main | sort -u | sed 's/^/sha-/' | paste -sd, -)
          echo "Protected from this sweep: ${tags}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Delete staged images past the re-run window
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          # The package must exist: the action fails on a missing one, so this job fails until the
          # first build has staged an image.
          packages: summit-42
          # Untagged versions are prior builds of a sha the workflow built twice, orphaned when the
          # re-run pushed the same tag to a new digest. The package is single-platform and nothing
          # resolves a staged image by digest, so an untagged one is unreachable.
          delete-tags: 'sha-*'
          delete-untagged: true
          exclude-tags: ${{ steps.live.outputs.tags }}
          older-than: 7 days
          dry-run: ${{ inputs.dry_run == true }}
