plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'io.freefair.lombok'
}

group = 'org.kinotic'
version = summit42Version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Central Portal Snapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
    }
}

dependencyManagement {
    imports {
        // the versions Kinotic builds against, which its published modules expect at runtime
        mavenBom("org.springframework.boot:spring-boot-dependencies:${springBootVersion}") {
            bomProperty 'httpclient5.version', httpclient5Version
            bomProperty 'httpcore5.version', httpcore5Version
            bomProperty 'jackson-2-bom.version', jackson2Version
            bomProperty 'jackson-bom.version', jacksonVersion
            bomProperty 'log4j2.version', log4j2Version
            bomProperty 'netty.version', nettyVersion
        }
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
    dependencies {
        dependency "co.elastic.clients:elasticsearch-java:${elasticClientVersion}"
        dependency "co.elastic.clients:elasticsearch-rest5-client:${elasticClientVersion}"
        dependency "org.kinotic:kinotic-core:${kinoticVersion}"
        dependency "org.kinotic:kinotic-domain:${kinoticVersion}"
        dependency "org.kinotic:kinotic-ee:${kinoticVersion}"
        dependency "org.kinotic:kinotic-management-api:${kinoticVersion}"
        dependency "org.kinotic:kinotic-sql:${kinoticVersion}"
        dependency "org.kinotic:kinotic-system-api:${kinoticVersion}"
        dependency "io.vertx:vertx-core:${vertxVersion}"
        dependency "io.vertx:vertx-health-check:${vertxVersion}"
        dependency "io.vertx:vertx-web:${vertxVersion}"
        dependency "io.vertx:vertx-web-client:${vertxVersion}"
    }
}

configurations {
    otelAgent {
        canBeResolved = true
        canBeConsumed = false
        // the agent is a self-contained shaded jar; only the single artifact is wanted
        transitive = false
    }
}

dependencies {
    implementation 'org.kinotic:kinotic-core'
    // run in process, as the management server runs them; kinotic-ee holds the secret storage backends its
    // deployments configure
    implementation 'org.kinotic:kinotic-domain'
    implementation 'org.kinotic:kinotic-ee'
    implementation 'org.kinotic:kinotic-management-api'
    // the migrations that create Summit 42's own Elasticsearch index
    implementation 'org.kinotic:kinotic-sql'
    // for the types of the system-api services Summit 42 calls; Summit42Application excludes its auto-configuration
    implementation 'org.kinotic:kinotic-system-api'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.ai:spring-ai-anthropic'
    implementation 'org.springframework.ai:spring-ai-openai'

    implementation 'co.elastic.clients:elasticsearch-java'

    implementation 'io.vertx:vertx-core'
    implementation 'io.vertx:vertx-health-check'
    implementation 'io.vertx:vertx-web'
    implementation 'io.vertx:vertx-web-client'
    implementation 'io.projectreactor:reactor-core'
    implementation 'org.apache.commons:commons-lang3'
    // reads the frontmatter of the Kinotic plugin's skills
    implementation 'org.yaml:snakeyaml'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'co.elastic.clients:elasticsearch-rest5-client'
    testImplementation 'org.testcontainers:testcontainers-elasticsearch'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${otelJavaagentVersion}"
}

// The jar embeds the OpenTelemetry Java agent as BOOT-INF/classes/opentelemetry-javaagent.jar, the path a
// deployment's -javaagent argument points at, as Kinotic's servers do
tasks.register('otelAgentJar', Sync) {
    from configurations.otelAgent
    rename { 'opentelemetry-javaagent.jar' }
    into layout.buildDirectory.dir('otel-agent')
}

tasks.named('processResources') {
    from(tasks.named('otelAgentJar'))
}

tasks.withType(JavaCompile).configureEach {
    // Kinotic's service schemas read method parameter names
    options.compilerArgs << '-parameters'
}

// Ignite reads JDK internals, which Kinotic's servers open the same way
def addOpens = ['--add-opens=java.base/java.nio=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
                '--add-opens=java.base/java.lang=ALL-UNNAMED']

tasks.named('bootRun') {
    jvmArgs addOpens
}

tasks.named('test') {
    useJUnitPlatform()
    // the tests boot the server as an Ignite cluster member
    jvmArgs addOpens
    // a test blocked on a stream that never ends fails instead of hanging the build; SEPARATE_THREAD lets the
    // timeout preempt a test blocked in StepVerifier.verify() or a future's get()
    systemProperty 'junit.jupiter.execution.timeout.default', '120 s'
    systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'SEPARATE_THREAD'
    testLogging {
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
}

tasks.named('bootBuildImage') {
    imageName = "kinoticai/summit-42:${project.version}"
    // the builder's latest tag can be published for one architecture only, which the amd64 CI runners cannot run
    builder = 'paketobuildpacks/builder-noble-java-tiny:0.0.200'
    environment = [
        'BP_HEALTH_CHECKER_ENABLED'    : 'true',
        'THC_PATH'                     : '/health',
        'BPE_DELIM_JAVA_TOOL_OPTIONS'  : ' ',
        'BPE_APPEND_JAVA_TOOL_OPTIONS' : (['-XX:+DisableExplicitGC'] + addOpens).join(' '),
    ]
    buildpacks = [
        'urn:cnb:builder:paketo-buildpacks/java',
        'docker.io/paketobuildpacks/health-checker'
    ]
}
